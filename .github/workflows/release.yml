name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
          VERSION="${GITHUB_REF_NAME#v}"
          # Section "## [X.Y.Z] ..." of CHANGELOG.md up to the next "## [" heading
          NOTES=$(awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md 2>/dev/null || true)
          {
            echo "body<<EOF"
            if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
              echo "$NOTES"
              echo ""
            elif [ -n "$PREV_TAG" ]; then
              echo "## Changes"
              echo ""
              git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD
              echo ""
            else
              echo "## Initial Release"
              echo ""
              echo "First public release of PDF Form Editor."
              echo ""
              echo "## Commits"
              echo ""
              git log --pretty=format:"- %s (%h)"
              echo ""
            fi
            echo ""
            echo "## Linux installation notes"
            echo ""
            echo "- **Debian / Ubuntu:** use the \`_amd64.deb\` package."
            echo "- **Fedora / RHEL / openSUSE:** prefer the \`.rpm\` package."
            echo "- **AppImage (universal):** make it executable first (\`chmod +x\`), then run it. If it does not start, install FUSE (Fedora: \`sudo dnf install fuse\`)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            rpm cpio desktop-file-utils

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: validate desktop entry
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          set -euo pipefail
          desktop-file-validate "src-tauri/target/release/bundle/deb/"*/data/usr/share/applications/*.desktop

      - name: add vendor metadata to rpm
        if: startsWith(matrix.platform, 'ubuntu-')
        run: bash scripts/patch-rpm-metadata.sh src-tauri/target/release/bundle/rpm

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -exec mv -t dist -- {} +
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'PDF Form Editor ${{ github.ref_name }}'
          body: ${{ needs.changelog.outputs.body }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
