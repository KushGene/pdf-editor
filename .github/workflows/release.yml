name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || echo "")
          {
            echo "body<<EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes"
              echo ""
              git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD
              echo ""
            else
              echo "## Initial Release"
              echo ""
              echo "First public release of PDF Form Editor."
              echo ""
              echo "## Commits"
              echo ""
              git log --pretty=format:"- %s (%h)"
              echo ""
            fi
            echo ""
            echo "## Linux installation notes"
            echo ""
            echo "- **Ubuntu 22.04 / Debian:** use the \`_22.04_amd64.deb\` package."
            echo "- **Ubuntu 24.04 / Debian (newer):** use the \`_24.04_amd64.deb\` package."
            echo "- **Fedora / RHEL / openSUSE:** prefer the \`.rpm\` package."
            echo "- **AppImage (universal):** make it executable first (\`chmod +x\`), then run it. If it does not start, install FUSE (Fedora: \`sudo dnf install fuse\`)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PDF Form Editor ${{ github.ref_name }}'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
